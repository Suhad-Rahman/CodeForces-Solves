name: Sync Codeforces AC Submissions

on:
  schedule:
    - cron: '0 3 * * *'   # once daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, do not write/commit/push"
        type: boolean
        default: false
      max_new:
        description: "Limit to N problems this run (0 = no limit). Use a small number while debugging."
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run sync
        env:
          CF_HANDLE: Suhad0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_NEW_PER_RUN: ${{ inputs.max_new }}
        run: python .github/scripts/sync_engine.py
