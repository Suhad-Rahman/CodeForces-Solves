name: Sync Codeforces AC Submissions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Existing Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Upgraded python standard image version

      - name: Install Network Dependencies
        run: pip install requests

      - name: Execute Fetch and Commit Script
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Handles runner engine compatibility safely
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true" 
        run: |
          python .github/scripts/sync_engine.py
