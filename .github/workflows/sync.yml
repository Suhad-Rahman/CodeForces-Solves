name: Sync Codeforces AC Submissions

on:
  schedule:
    - cron: '0 */6 * * *' # Runs fully automated every 6 hours
  workflow_dispatch: # Allows you to force a sync manually anytime

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Existing Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Dependencies
        run: pip install requests

      - name: Execute Fetch and Commit Script
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python .github/scripts/sync_engine.py
